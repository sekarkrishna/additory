[build-system]
requires = ["maturin>=1.0,<2.0"]
build-backend = "maturin"

[project]
name = "additory"
version = "0.1.3a11"
description = "Elegant data operations for DataFrames - add.to(), add.transform(), add.synthetic()"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "Krishnamoorthy Sankaran", email = "krishnamoorthy.sankaran@sekrad.org"}
]
maintainers = [
    {name = "Krishnamoorthy Sankaran", email = "krishnamoorthy.sankaran@sekrad.org"}
]
keywords = ["dataframe", "data", "pandas", "polars", "rust", "data-augmentation", "synthetic-data"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Rust",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = ["polars>=0.19.0", "pyarrow>=10.0.0"]

[project.urls]
Homepage = "https://github.com/sekarkrishna/additory"
Repository = "https://github.com/sekarkrishna/additory"
Issues = "https://github.com/sekarkrishna/additory/issues"
Documentation = "https://github.com/sekarkrishna/additory#readme"

[project.optional-dependencies]
pandas = ["pandas>=1.5.0", "pyarrow>=10.0.0"]
all = ["pandas>=1.5.0", "pyarrow>=10.0.0"]
dev = [
    "pytest>=7.0",
    "pandas>=1.5.0",
    "pyarrow>=10.0.0",
]

[tool.maturin]
features = ["python"]
module-name = "additory._additory"
