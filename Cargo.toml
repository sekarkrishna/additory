[package]
name = "additory"
version = "0.1.3-alpha.11"
edition = "2021"
authors = ["Krishnamoorthy Sankaran <krishnamoorthy.sankaran@sekrad.org>"]
description = "Elegant data operations for DataFrames - add.to(), add.transform(), add.synthetic()"
license = "MIT"
repository = "https://github.com/sekarkrishna/additory"
homepage = "https://github.com/sekarkrishna/additory"
documentation = "https://github.com/sekarkrishna/additory#readme"
keywords = ["dataframe", "data", "pandas", "polars", "synthetic"]
categories = ["data-structures", "science"]
readme = "README.md"

[lib]
name = "additory"
crate-type = ["cdylib", "rlib"]

[dependencies]
# DataFrame backends  
polars = { version = "0.44", features = ["lazy", "dtype-full", "ipc"] }

# Python bindings
pyo3 = { version = "0.21", features = ["extension-module"], optional = true }
lazy_static = "1.4"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Logging
log = "0.4"
env_logger = "0.11"

# Random/distributions for synthetic data
rand = "0.8"
rand_distr = "0.4"

# Date/time for synthetic data
chrono = "0.4"

# Pattern generation for synthetic data
uuid = { version = "1.0", features = ["v4"] }
regex = "1.0"

# Statistics
statrs = "0.16"

[dev-dependencies]
proptest = "1.4"
criterion = "0.5"
tempfile = "3"

[features]
default = []
python = ["pyo3"]

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
