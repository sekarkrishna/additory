site_name: Additory Documentation
site_url: https://sekarkrishna.github.io/additory
repo_url: https://github.com/sekarkrishna/additory
repo_name: sekarkrishna/additory

theme:
  name: material
  palette:
    - scheme: default
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: deep purple
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.tabs.link
    - content.code.copy
    - content.code.annotate
  icon:
    repo: fontawesome/brands/github

plugins:
  - search
  - minify:
      minify_html: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.details
  - pymdownx.snippets
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_css:
  - assets/css/custom.css

extra_javascript:
  - assets/js/shuffle.js

nav:
  - Home: index.md
  - Getting Started:
    - Installation: getting-started/install.md
    - Quickstart: getting-started/quickstart.md
  - Core Functions:
    - functions/index.md
    - "add.to()": functions/to.md
    - "add.transform()": functions/transform.md
    - "add.synthetic()": functions/synthetic.md
    - "add.scan()": functions/scan.md
    - "add.scan('@diff')": functions/diff.md
    - "add.<dynamic>()": functions/dynamic.md
  - Transform Modes:
    - transform/index.md
    - "@calc": transform/calc.md
    - "@filter & @sort": transform/filter-sort.md
    - "@aggregate": transform/aggregate.md
    - "@deduce": transform/deduce.md
    - "Text Modes": transform/text.md
    - "@harmonize": transform/harmonize.md
  - Cross-Cutting Features:
    - features/index.md
    - Pipe Compatibility: features/pipe.md
    - Lineage Tracking: features/lineage.md
    - Logging & Timing: features/logging.md
    - Type Handling: features/type-handling.md
  - Guides:
    - guides/index.md
    - Expression Files: guides/expression-files.md
    - Reconciliation: guides/reconciliation.md
    - Troubleshooting: guides/troubleshooting.md
  - Reference:
    - API Reference: reference/api.md
    - Expression Catalog: reference/expressions.md
    - Changelog: reference/changelog.md
